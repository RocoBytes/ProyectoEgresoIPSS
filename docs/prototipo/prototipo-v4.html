<title>Prototipo Perfil de Egreso</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Montserrat:wght@400;500;600;700&display=swap">
<style>
/* Layout: aplicación a pantalla completa. Barra lateral azul marino fija, barra superior con búsqueda y cuenta, contenido en tarjetas.
   Firma visual: el folio del registro en tipografía monoespaciada y la "pista" de trazabilidad (sesión, registro, compromiso, cierre).
   Un solo aspecto claro por decisión: es el único tema que tendrá el producto. */
:root{
  --navy:#102B42; --navy-2:#183A5A; --navy-3:#0B2134; --marino-claro:#DCE4EB;
  --azul:#0077C2; --azul-osc:#005C97; --azul-claro:#E6F1FA; --azul-borde:#B5D5EE; --anillo:rgba(0,119,194,.24);
  --oro:#CFB47C; --oro-osc:#86661F; --oro-claro:#F7F0E0;
  --fondo:#F5F3F0; --barra-fondo:rgba(245,243,240,.9); --superficie:#FFFFFF; --superficie-2:#FAF9F7; --borde:#E4DFD8; --borde-fuerte:#C9C2B8;
  --texto:#1E2A35; --texto-2:#5C6773;
  --sobre-navy:#FFFFFF; --sobre-navy-2:#AFC1D1; --sobre-navy-3:#7C95AC; --linea-navy:rgba(255,255,255,.14); --velo-navy:rgba(255,255,255,.05);
  --ok:#17693F; --ok-relleno:#2F8F5B; --ok-fondo:#E4F3EA; --ok-borde:#A9D5BC;
  --alerta:#96490A; --alerta-relleno:#C47A12; --alerta-fondo:#FCF0D5; --alerta-borde:#EBCB8B;
  --error:#A8261B; --error-fondo:#FCEBE8; --error-borde:#EFB3AC;
  --neutro:#535A62; --neutro-relleno:#8E887F; --neutro-fondo:#EEEBE7; --neutro-borde:#D4CEC6;
  --velo:rgba(11,33,52,.56); --sombra-1:0 1px 2px rgba(16,43,66,.05); --sombra-2:0 16px 40px rgba(16,43,66,.16);
  --r:12px; --r-s:8px; --r-xs:6px;
  --fuente:'Montserrat','Segoe UI',system-ui,-apple-system,sans-serif; --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--fondo);color:var(--texto);font-family:var(--fuente);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--navy)}
#app{min-height:100%;display:flex;flex-direction:column}
#app>*{flex:1 0 auto}
h1,h2,h3,p,ol,ul{margin:0}
h1{font-size:24px;line-height:1.2;font-weight:700;color:var(--navy);letter-spacing:-.01em;text-wrap:balance}
h2{font-size:15px;font-weight:700;color:var(--navy)}
h3{font-size:13px;font-weight:700;color:var(--navy)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.suave{color:var(--texto-2)}
.mini{font-size:12.5px}
.folio{display:inline-block;font-family:var(--mono);font-weight:500;font-size:12.5px;color:var(--navy);background:var(--superficie-2);border:1px solid var(--borde-fuerte);border-radius:var(--r-xs);padding:2px 7px;white-space:nowrap;line-height:1.5}
button.folio{cursor:pointer}
button.folio:hover{border-color:var(--azul);color:var(--azul-osc);background:var(--azul-claro)}

/* Botones y campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:var(--r-s);border:1px solid transparent;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;background:none;transition:background .12s,border-color .12s}
.btn-pri{background:var(--azul);color:var(--sobre-navy)}
.btn-pri:hover{background:var(--azul-osc)}
.btn-sec{background:var(--superficie);border-color:var(--borde-fuerte);color:var(--navy)}
.btn-sec:hover{border-color:var(--navy);background:var(--superficie-2)}
.btn-rojo{background:var(--error);color:var(--sobre-navy)}
.btn-fantasma{color:var(--texto-2)}
.btn-fantasma:hover{background:var(--neutro-fondo);color:var(--texto)}
.btn-ancho{width:100%}
.btn-icono{width:36px;min-height:36px;padding:0;border-radius:var(--r-s);color:var(--texto-2)}
.btn-icono:hover{background:var(--neutro-fondo);color:var(--navy)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.giro{width:15px;height:15px;border-radius:50%;border:2px solid var(--linea-navy);border-top-color:var(--sobre-navy);animation:gira .7s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.enlace{background:none;border:0;padding:0;color:var(--azul-osc);font-weight:600;cursor:pointer;text-align:left}
.enlace:hover{text-decoration:underline;text-underline-offset:3px}
.campo{display:grid;gap:6px;min-width:0;align-content:start}
.campo label,.etq{font-size:12.5px;font-weight:600;color:var(--texto)}
.campo .ayuda{font-size:12px;color:var(--texto-2)}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=search],select,textarea{width:100%;min-height:40px;padding:8px 12px;border:1px solid var(--borde-fuerte);border-radius:var(--r-s);background:var(--superficie);transition:border-color .12s,box-shadow .12s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--azul);box-shadow:0 0 0 3px var(--anillo)}
textarea{min-height:88px;resize:vertical}
::placeholder{color:var(--texto-2);opacity:.75}
select[disabled],input[disabled]{background:var(--neutro-fondo);color:var(--texto-2)}
[aria-invalid=true]{border-color:var(--error)!important}
.err{font-size:12.5px;color:var(--error);font-weight:600}
.aviso{border-radius:var(--r-s);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;border:1px solid;font-size:13px}
.aviso>div{display:grid;gap:2px;min-width:0}
.aviso b{font-weight:700}
.aviso .ic{margin-top:1px}
.aviso-error{background:var(--error-fondo);border-color:var(--error-borde);color:var(--error)}
.aviso-alerta{background:var(--alerta-fondo);border-color:var(--alerta-borde);color:var(--alerta)}
.aviso-info{background:var(--azul-claro);border-color:var(--azul-borde);color:var(--azul-osc)}
.aviso-ok{background:var(--ok-fondo);border-color:var(--ok-borde);color:var(--ok)}
.aviso-neutro{background:var(--neutro-fondo);border-color:var(--neutro-borde);color:var(--neutro)}

/* Marca */
.marca{display:flex;align-items:center;gap:11px;color:var(--sobre-navy);line-height:1.15}
.marca svg{flex:none}
.marca b{display:block;font-size:15px;font-weight:700}
.marca span{display:block;font-size:11px;color:var(--sobre-navy-2);letter-spacing:.04em;margin-top:2px}

/* Acceso */
.acceso{display:grid;grid-template-columns:minmax(0,11fr) minmax(0,10fr)}
.acceso-marca{background:var(--navy);color:var(--sobre-navy);display:flex;flex-direction:column;gap:32px;justify-content:space-between;position:relative;overflow:hidden;
  padding:40px 48px 32px max(48px,env(safe-area-inset-left,0px))}
.acceso-marca::after{content:"";position:absolute;right:-170px;top:-170px;width:420px;height:420px;border-radius:50%;border:1px solid var(--linea-navy);box-shadow:0 0 0 120px var(--velo-navy);pointer-events:none}
.acceso-marca>*{position:relative;z-index:1}
.lema{font-size:32px;line-height:1.16;font-weight:700;letter-spacing:-.015em;max-width:15ch;text-wrap:balance}
.lema em{font-style:normal;color:var(--oro)}
.acceso-marca .sub{color:var(--sobre-navy-2);max-width:44ch;margin-top:14px;font-size:14.5px}
.ficha{background:var(--navy-2);border:1px solid var(--linea-navy);border-radius:var(--r);padding:18px 20px;display:grid;gap:14px;max-width:400px;box-shadow:var(--sombra-2)}
.ficha-cab{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ficha .folio{background:var(--navy-3);border-color:var(--linea-navy);color:var(--oro)}
.ficha-titulo b{display:block;font-size:14.5px}
.ficha-titulo span{font-size:12.5px;color:var(--sobre-navy-2)}
.acceso-pie{font-size:12px;color:var(--sobre-navy-3)}
.acceso-form{background:var(--superficie);display:flex;align-items:center;justify-content:center;
  padding:40px max(24px,env(safe-area-inset-right,0px)) 40px 24px}
.acceso-caja{width:100%;max-width:380px;display:grid;gap:22px}
.acceso-caja form{display:grid;gap:16px}
.clave{position:relative}
.clave input{padding-right:46px}
.clave .btn-icono{position:absolute;right:2px;top:2px}
.nota-acceso{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--texto-2);border-top:1px solid var(--borde);padding-top:16px}

/* Estructura con sesión */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr)}
.lateral{background:var(--navy);color:var(--sobre-navy);display:flex;flex-direction:column;gap:28px;position:sticky;top:0;align-self:start;height:100vh;max-height:100dvh;
  padding:22px 14px 18px max(14px,env(safe-area-inset-left,0px))}
.lateral-cab{display:flex;align-items:center;justify-content:space-between;padding:0 6px}
.lateral-cab .btn-icono{display:none;color:var(--sobre-navy)}
.lateral-cab .btn-icono:hover{background:var(--navy-2);color:var(--sobre-navy)}
.lateral nav{display:grid;gap:3px}
.nav-etq{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sobre-navy-3);padding:0 12px 8px}
.lateral nav button{display:flex;align-items:center;gap:11px;background:none;border:0;border-radius:var(--r-s);padding:10px 12px;text-align:left;color:var(--sobre-navy-2);font-weight:600;font-size:13.5px;cursor:pointer;position:relative}
.lateral nav button:hover{background:var(--velo-navy);color:var(--sobre-navy)}
.lateral nav button[aria-current=page]{background:var(--navy-2);color:var(--sobre-navy)}
.lateral nav button[aria-current=page]::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--oro)}
.lateral nav button[aria-current=page] .ic{color:var(--oro)}
.lateral-pie{margin-top:auto;font-size:11.5px;color:var(--sobre-navy-3);padding:0 12px}
.principal{min-width:0;display:flex;flex-direction:column}
.barra{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:16px;align-items:center;justify-content:space-between;min-height:64px;background:var(--barra-fondo);backdrop-filter:blur(10px);border-bottom:1px solid var(--borde);
  padding:10px max(32px,env(safe-area-inset-right,0px)) 10px 32px}
.buscador{position:relative;flex:1;max-width:420px;min-width:0}
.buscador .ic{position:absolute;left:12px;top:11px;color:var(--texto-2);pointer-events:none}
.buscador input{padding-left:38px}
.usuario{position:relative;flex:none}
.usuario-btn{display:flex;align-items:center;gap:10px;background:none;border:1px solid transparent;border-radius:999px;padding:4px 10px 4px 4px;cursor:pointer;text-align:left}
.usuario-btn:hover,.usuario-btn[aria-expanded=true]{background:var(--superficie);border-color:var(--borde)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--navy);color:var(--oro);display:grid;place-items:center;font-size:12px;font-weight:700;letter-spacing:.04em;flex:none}
.usuario-txt{display:grid;line-height:1.25}
.usuario-txt b{font-size:13px;color:var(--navy)}
.usuario-txt span{font-size:11.5px;color:var(--texto-2)}
.usuario-menu{position:absolute;right:0;top:calc(100% + 8px);width:280px;background:var(--superficie);border:1px solid var(--borde);border-radius:var(--r);box-shadow:var(--sombra-2);padding:16px;display:grid;gap:14px;z-index:25}
.usuario-menu dl{grid-template-columns:minmax(0,1fr);gap:1px}
.usuario-menu dd{margin-bottom:8px;overflow-wrap:anywhere}
.contenido{width:100%;max-width:1240px;margin:0 auto;display:grid;gap:22px;align-content:start;padding:28px max(32px,env(safe-area-inset-right,0px)) 56px 32px}
.cab{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.cab p{max-width:68ch;margin-top:4px}
.acciones{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tarjeta{background:var(--superficie);border:1px solid var(--borde);border-radius:var(--r);box-shadow:var(--sombra-1);padding:20px;display:grid;gap:14px;min-width:0;align-content:start}
.tarjeta-cab{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 10px}
.rejilla{display:grid;gap:14px 16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.dos{display:grid;gap:20px;grid-template-columns:minmax(0,5fr) minmax(0,3fr);align-items:start}
.columna{display:grid;gap:20px;min-width:0;align-content:start}
.miga{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--texto-2)}
.miga .ic{width:14px;height:14px}

/* Panel */
.segmento{display:inline-flex;background:var(--neutro-fondo);border-radius:var(--r-s);padding:3px;gap:2px}
.segmento button{border:0;background:none;border-radius:var(--r-xs);padding:6px 14px;font-weight:600;font-size:13px;color:var(--texto-2);cursor:pointer}
.segmento button[aria-pressed=true]{background:var(--superficie);color:var(--navy);box-shadow:var(--sombra-1)}
.panel-filtros{display:grid;gap:12px 16px;grid-template-columns:auto minmax(0,1fr) minmax(0,1.4fr) auto;align-items:end}
.panel-filtros .segmento{min-height:40px}
.panel-filtros .segmento button{padding:6px 16px}
.panel-res{font-size:13px;color:var(--texto-2);white-space:nowrap;padding-bottom:9px}
.panel-res b{font-size:22px;line-height:1;color:var(--navy);margin-right:3px}
.fila-2-1{display:grid;gap:20px;grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.fila-3{display:grid;gap:20px;grid-template-columns:repeat(3,minmax(0,1fr))}
.leyendas{display:flex;flex-wrap:wrap;gap:6px 14px}
.ley{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--texto-2)}
.ley i,.ley-fila i{width:10px;height:10px;border-radius:3px;flex:none}
.seg-cerrado{background:var(--ok-relleno)} .seg-abierto{background:var(--azul)} .seg-anulado{background:var(--neutro-relleno)} .seg-vencido{background:var(--alerta-relleno)}

/* Indicadores principales */
.tiles{display:grid;gap:16px;grid-template-columns:repeat(4,minmax(0,1fr))}
.tile{display:grid;gap:12px;align-content:space-between;text-align:left;background:var(--superficie);border:1px solid var(--borde);border-radius:var(--r);box-shadow:var(--sombra-1);padding:16px 18px 18px;min-width:0;color:var(--texto)}
button.tile{cursor:pointer;transition:border-color .12s,transform .12s}
button.tile:hover{border-color:var(--borde-fuerte);transform:translateY(-1px)}
.tile-cab{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tile-etq{font-size:12.5px;font-weight:600;color:var(--texto-2)}
.tile-ic{width:32px;height:32px;border-radius:var(--r-s);display:grid;place-items:center;background:var(--azul-claro);color:var(--azul-osc);flex:none}
.tile-ic.verde{background:var(--ok-fondo);color:var(--ok)} .tile-ic.dorado{background:var(--oro-claro);color:var(--oro-osc)}
.tile-fila{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.tile-valor{font-size:36px;line-height:1;font-weight:700;color:var(--navy);letter-spacing:-.02em}
.tile-sub{font-size:12.5px;color:var(--texto-2)}
.tile-sub.aten{color:var(--alerta);font-weight:600}
.tile-navy{background:var(--navy);border-color:var(--navy);color:var(--sobre-navy)}
button.tile-navy:hover{border-color:var(--navy-2)}
.tile-navy .tile-etq,.tile-navy .tile-sub{color:var(--sobre-navy-2)}
.tile-navy .tile-valor{color:var(--sobre-navy)}
.tile-navy .tile-ic{background:var(--navy-2);color:var(--oro)}
.metro{display:flex;gap:2px;height:8px}
.metro span{display:block;border-radius:4px;min-width:4px}
.metro .vacio-m{flex:1;background:var(--neutro-fondo)}
.medidor{display:block;height:8px;border-radius:4px;overflow:hidden}
.medidor span{display:block;height:100%;border-radius:4px}
.medidor.ok{background:var(--ok-fondo)} .medidor.ok span{background:var(--ok-relleno)}
.medidor.oro{background:var(--oro-claro)} .medidor.oro span{background:var(--oro)}

/* Líneas de tendencia */
.chispa{position:relative;display:block;height:40px;margin-right:6px}
.chispa svg{display:block;width:100%;height:100%;overflow:visible}
.ch-linea{fill:none;stroke:var(--neutro-relleno);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ch-area{fill:var(--neutro-relleno);opacity:.1;stroke:none}
.ch-punto{position:absolute;width:10px;height:10px;border-radius:50%;transform:translate(-50%,-50%);background:var(--neutro-relleno);box-shadow:0 0 0 2px var(--superficie)}
.chispa.acento .ch-linea{stroke:var(--azul)} .chispa.acento .ch-area{fill:var(--azul)} .chispa.acento .ch-punto{background:var(--azul)}
.chispa.oro .ch-linea{stroke:var(--oro)} .chispa.oro .ch-area{fill:var(--oro);opacity:.16} .chispa.oro .ch-punto{background:var(--oro);box-shadow:0 0 0 2px var(--navy)}

/* Columnas apiladas por mes */
.grafico{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:18px 256px auto;gap:0 10px}
.eje-y{grid-row:2;position:relative;width:1.2rem;font-size:11px;color:var(--texto-2);font-variant-numeric:tabular-nums}
.eje-y span{position:absolute;right:0;transform:translateY(50%)}
.plot{grid-row:2;grid-column:2;position:relative;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));border-bottom:1px solid var(--borde-fuerte)}
.linea-g{position:absolute;left:0;right:0;height:1px;background:var(--borde)}
.col{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;border-radius:var(--r-xs) var(--r-xs) 0 0;outline-offset:-2px}
.col:hover,.col:focus-visible{background:var(--superficie-2)}
.pila{display:flex;flex-direction:column-reverse;gap:2px;width:22px;max-width:56%;flex:none}
.pila span{display:block;min-height:3px}
.pila span:last-child{border-radius:4px 4px 0 0}
.col:hover .pila span{filter:brightness(1.08)}
.tope{font-size:12px;font-weight:700;color:var(--navy);line-height:1;margin-bottom:4px}
.eje-x{grid-row:3;grid-column:2;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));font-size:11px;color:var(--texto-2);text-align:center;padding-top:7px}
.eje-x .futuro{opacity:.55}

/* Dona de estados */
.dona-caja{display:flex;flex-wrap:wrap;gap:18px 24px;align-items:center;justify-content:center}
.dona{position:relative;width:168px;height:168px;flex:none}
.dona svg{display:block}
.dona-seg{fill:none;stroke-width:22;cursor:default}
.dona-pista{fill:none;stroke:var(--neutro-fondo);stroke-width:22}
.dona-seg:hover{stroke-width:25}
.t-cerrado{stroke:var(--ok-relleno)} .t-abierto{stroke:var(--azul)} .t-anulado{stroke:var(--neutro-relleno)}
.dona-centro{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.dona-centro b{font-size:34px;line-height:1;color:var(--navy);letter-spacing:-.02em}
.dona-centro span{font-size:12px;color:var(--texto-2);margin-top:3px}
.ley-lista{display:grid;gap:2px;flex:1;min-width:150px}
.ley-fila{display:grid;grid-template-columns:auto minmax(0,1fr) auto 2.6rem;gap:10px;align-items:center;background:none;border:0;border-radius:var(--r-xs);padding:8px;text-align:left;cursor:pointer;font-size:13px}
.ley-fila:hover{background:var(--superficie-2)}
.ley-fila b{color:var(--navy);font-variant-numeric:tabular-nums}
.ley-fila .pc{color:var(--texto-2);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}

/* Anillos de cumplimiento */
.indicadores{display:grid;gap:16px;grid-template-columns:repeat(3,minmax(0,1fr))}
.indicador{display:grid;gap:10px;justify-items:center;text-align:center;align-content:start}

  if (destino === 'cierre' && !esPdf && !esFoto) return `“${nombre}” no se puede usar como evidencia. Adjunta un PDF, JPG o PNG.`;
  if (destino === 'malla' && !esPdf) return `“${nombre}” no es un PDF. La malla debe adjuntarse en PDF.`;

  if (M.tipo === 'editar') return marco(`Editar el registro ${r.id}`, `
    <p class="suave">El número, la carrera y la sesión de origen no cambian. Cada edición queda en el historial con el valor anterior.</p>
    <div class="campo"><label for="m-descripcion">Descripción de lo observado</label><textarea id="m-descripcion" data-campo="modal.campos.descripcion"${i1('descripcion')}>${esc(C.descripcion)}</textarea>${e1('descripcion')}</div>
    <div class="campo" style="max-width:240px"><label for="m-comprometida">Fecha comprometida</label><input type="date" id="m-comprometida" data-campo="modal.campos.comprometida" value="${esc(C.comprometida)}" min="${sesionDe(r).fecha}"${i1('comprometida')}>${e1('comprometida')}</div>`, 'Guardar cambios');
  if (M.tipo === 'malla') return marco('Nueva versión de malla', `
    <p class="suave">${esc(carrera(estado.mallasCarrera).nombre)}</p>
    <div class="rejilla" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">
      <div class="campo"><label for="m-anio">Año de la malla</label><input type="text" inputmode="numeric" id="m-anio" data-campo="modal.campos.anio" value="${esc(C.anio)}"${i1('anio')}>${e1('anio')}</div>
      <div class="campo"><label for="m-vigente">Vigente desde</label><input type="date" id="m-vigente" data-campo="modal.campos.vigente" value="${esc(C.vigente)}"${i1('vigente')}>${e1('vigente')}</div></div>
    ${adjunto('Archivo de la malla', 'malla', 'PDF de hasta 20 MB.')}`, 'Subir versión');
  if (M.tipo === 'confirmar') { const b = estado.borrador; return marco('Guardar la sesión', `
    <p>Se registrará la sesión del <b class="num">${f(b.fecha)}</b> (${esc(b.canal)}) con ${plural(b.registros.length, 'registro', 'registros')}:</p>
    <ul class="lista-conf">${b.registros.map(x => `<li><b>${esc(carrera(x.carrera).nombre)}</b>: ${esc(x.nivel)} · ${esc(objetoFinal(x))}, comprometido para el <span class="num">${f(x.comprometida)}</span></li>`).join('')}</ul>
    ${aviso('info', '', 'Al guardar se asigna un número a cada registro. Los registros no se eliminan: un error se corrige editando o anulando.')}`, 'Confirmar y guardar'); }
  return marco('Descartar el borrador', `<p>Se perderá lo que escribiste en esta sesión, incluidos los archivos adjuntos.</p>`, 'Descartar', 'btn-rojo');
}
function enviarModal() {
  const M = estado.modal, C = M.campos, E = M.errores = {}, r = datos.registros.find(x => x.id === estado.detalleId), u = estado.usuario, ahora = Date.now();
  if (M.tipo === 'cerrar') {
    if (!C.efectiva) E.efectiva = 'Indica la fecha en que el cambio se hizo efectivo.';
    else if (C.efectiva > hoyISO()) E.efectiva = 'La fecha efectiva no puede ser posterior a hoy.';
    else if (C.efectiva < sesionDe(r).fecha) E.efectiva = `La fecha efectiva no puede ser anterior a la sesión (${f(sesionDe(r).fecha)}).`;
    if (!C.archivo) E.archivo = 'Adjunta la evidencia. Sin ella el registro no se puede cerrar.';
    if (Object.keys(E).length) return pintar();
    Object.assign(r, { estado: 'cerrado', efectiva: C.efectiva, evidenciaCierre: C.archivo, comentarioCierre: C.comentario.trim() });
    r.historial.push({ ts: ahora, usuario: u.nombre, tipo: 'cierre', texto: `Cerrado con fecha efectiva ${f(C.efectiva)} y evidencia “${C.archivo.nombre}”.` });
    toast(`El registro ${r.id} quedó cerrado.`);
  } else if (M.tipo === 'anular') {
    if (C.motivo.trim().length < 10) { E.motivo = 'Explica el motivo con al menos 10 caracteres.'; return pintar(); }
    Object.assign(r, { estado: 'anulado', motivo: C.motivo.trim() });
    r.historial.push({ ts: ahora, usuario: u.nombre, tipo: 'anulacion', texto: `Anulado. Motivo: ${C.motivo.trim()}` });
    toast(`El registro ${r.id} quedó anulado.`);
  } else if (M.tipo === 'editar') {
    if (C.descripcion.trim().length < 20) E.descripcion = 'La descripción necesita al menos 20 caracteres.';
    if (!C.comprometida) E.comprometida = 'Indica la fecha comprometida.'; else if (C.comprometida < sesionDe(r).fecha) E.comprometida = 'No puede ser anterior a la sesión.';
    if (Object.keys(E).length) return pintar();
    const cambios = [];
    if (C.comprometida !== r.comprometida) cambios.push(`la fecha comprometida de ${f(r.comprometida)} a ${f(C.comprometida)}`);
    if (C.descripcion.trim() !== r.descripcion) cambios.push(`la descripción (antes: “${r.descripcion}”)`);
    if (cambios.length) { r.historial.push({ ts: ahora, usuario: u.nombre, tipo: 'edicion', texto: 'Cambió ' + cambios.join(' y ') + '.' }); r.descripcion = C.descripcion.trim(); r.comprometida = C.comprometida; toast('Cambios guardados. Quedaron en el historial.'); }
    else toast('No había cambios que guardar.');
  } else if (M.tipo === 'malla') {
    const a = Number(C.anio);
    if (!/^\d{4}$/.test(C.anio) || a < 2000 || a > new Date().getFullYear() + 1) E.anio = 'Escribe el año con cuatro dígitos.';
    else if (datos.mallas.some(m => m.carrera === estado.mallasCarrera && m.anio === a)) E.anio = `Ya existe la malla ${a} de esta carrera.`;
    if (!C.vigente) E.vigente = 'Indica desde cuándo rige.';
    if (!C.archivo) E.archivo = 'Adjunta el PDF de la malla.';
    if (Object.keys(E).length) return pintar();
    datos.mallas.push({ id: uid(), carrera: estado.mallasCarrera, anio: a, vigente: C.vigente, archivo: C.archivo, subidoPor: u.nombre, ts: ahora });
    toast(`La malla ${a} quedó cargada.`);
  } else if (M.tipo === 'confirmar') {
    estado.modal = null; estado.guardando = true; pintar();
    return setTimeout(() => { estado.guardando = false; guardarSesion(); pintar(); window.scrollTo({ top: 0 }); }, 800);
  } else { estado.borrador = null; estado.erroresForm = null; estado.vista = 'registros'; toast('Borrador descartado.'); }
  estado.modal = null; guardarLocal(); pintar();
}

/* ---------- Pintado ---------- */
function pintar() {
  const act = document.activeElement, fid = estado._foco || (act && act.id) || null; let sel = null;
  try { if (act && act.id && act.id === fid && act.selectionStart != null) sel = [act.selectionStart, act.selectionEnd]; } catch { /* campos sin selección */ }
  estado._foco = null;
  appEl.innerHTML = estado.usuario ? vistaShell() : vistaLogin();
  modalEl.innerHTML = estado.modal ? vistaModal() : '';
  tipEl.hidden = true;
  if (estado.usuario && estado.vista === 'panel') animarCifras();
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus(); if (sel) { try { el.setSelectionRange(sel[0], sel[1]); } catch { /* idem */ } } } }
}
function ir(vista) {
  if (vista === 'nueva' && estado.exito) estado.exito = null;
  if (vista === 'panel') memoPanel = {};
  estado.vista = vista; estado.menuNav = false; estado.menuUsuario = false; if (vista !== 'nueva') estado.erroresForm = null; pintar(); window.scrollTo({ top: 0 });
}
function asignar(ruta, valor) { const p = ruta.split('.'); let o = estado; for (let i = 0; i < p.length - 1; i++) o = o[p[i]]; o[p[p.length - 1]] = valor; }
let relojBorrador = null;
function limpiarError(id) {
  const E = estado.erroresForm; if (!E || !id || !E[id]) return;
  delete E[id];
  const el = document.getElementById(id); if (el) { el.removeAttribute('aria-invalid'); el.removeAttribute('aria-describedby'); }
  const sp = document.getElementById(id + '-err'); if (sp) sp.remove();
  const enlace = document.querySelector(`#resumen-err [data-id="${id}"]`); if (enlace && enlace.parentElement) enlace.parentElement.remove();
  const caja = document.getElementById('resumen-err'), n = Object.keys(E).length;
  if (!n) { estado.erroresForm = null; if (caja) caja.remove(); } else if (caja) caja.querySelector('b').textContent = `No se pudo guardar. Revisa ${plural(n, 'campo', 'campos')}:`;
}
function refrescarResumen() { const el = document.getElementById('resumen-nueva'); if (el && estado.borrador) el.innerHTML = resumenNueva(); }
function marcarBorrador() { if (!estado.borrador) return; estado.borrador.guardado = Date.now(); guardarLocal(); refrescarResumen(); }
function restaurarDatos() {
  datos = semilla(); estado.borrador = null; estado.exito = null; estado.erroresForm = null; estado.filtros = filtrosVacios(); estado.pagina = 1; estado.modal = null; estado.panel = { sector: '', carrera: '' }; guardarPanel();
  if (estado.vista === 'detalle') estado.vista = 'registros'; guardarLocal(); pintar(); toast('Datos de ejemplo restaurados.');
}

/* ---------- Acciones ---------- */
function despachar(accion, d) {
  if (estado.usuario && estado.expirada) return salir('expirada');
  const L = estado.login, b = estado.borrador;
  switch (accion) {
    case 'login-enviar': return enviarLogin();
    case 'login-ver': L.verClave = !L.verClave; estado._foco = 'login-clave'; return pintar();
    case 'login-olvido': L.olvido = !L.olvido; return pintar();
    case 'menu-usuario': estado.menuUsuario = !estado.menuUsuario; return pintar();
    case 'menu-nav': estado.menuNav = !estado.menuNav; return pintar();
    case 'salir': return salir('salida');
    case 'buscar': estado.filtros = { ...filtrosVacios(), q: estado.busqueda.trim() }; estado.busqueda = ''; estado.pagina = 1; return ir('registros');
    case 'ir': return ir(d.vista);
    case 'ver': if (!d.id) return; estado.detalleId = d.id; return ir('detalle');
    case 'panel-anio': estado.anioPanel = d.anio; guardarPanel(); return pintar();
    case 'panel-quitar': estado.panel[d.k] = ''; if (d.k === 'sector') estado.panel.carrera = ''; guardarPanel(); estado._foco = d.k === 'sector' ? 'p-sector' : 'p-carrera'; return pintar();
    case 'panel-limpiar': estado.panel = { sector: '', carrera: '' }; guardarPanel(); estado._foco = 'p-sector'; return pintar();
    // Del panel al listado: viajan el año y los filtros del panel, más la dimensión en la que se hizo clic
    case 'panel-filtrar': estado.filtros = { ...filtrosVacios(), anio: estado.anioPanel, sector: estado.panel.sector, carrera: estado.panel.carrera, [d.filtro]: d.valor }; estado.pagina = 1; return ir('registros');
    case 'filtros-limpiar': estado.filtros = filtrosVacios(); estado.pagina = 1; return pintar();
    case 'filtro-quitar': estado.filtros[d.k] = d.k === 'anio' ? 'todos' : ''; if (d.k === 'sector') estado.filtros.carrera = ''; estado.pagina = 1; return pintar();
    case 'pagina': estado.pagina = Number(d.p); return pintar();
    case 'exportar': { const F = estado.filtros; return toast(`Se generó registros-${F.anio === 'todos' ? 'todos' : F.anio}.xlsx con ${plural(filtrar().length, 'fila', 'filas')}, las mismas del listado.`); }
    case 'descargar': return toast(`Descargando “${d.nombre}”.`);
    case 'foco': { const el = document.getElementById(d.id); if (el) { el.focus(); el.scrollIntoView({ block: 'center' }); } return; }
    case 'reg-agregar': b.registros.push(registroVacio(estado.usuario)); marcarBorrador(); estado._foco = `r${b.registros.length - 1}-${carrerasDe(estado.usuario).length === 1 ? 'nivel' : 'sector'}`; return pintar();
    case 'reg-quitar': b.registros.splice(Number(d.i), 1); estado.erroresForm = null; marcarBorrador(); return pintar();
    case 'acta-quitar': b.acta = null; marcarBorrador(); return pintar();
    case 'foto-quitar': b.fotos = b.fotos.filter(a => a.id !== d.id); marcarBorrador(); return pintar();
    case 'modal-archivo-quitar': estado.modal.campos.archivo = null; return pintar();
    case 'archivo-elegir': destinoArchivo = d.destino; selector.accept = d.destino === 'foto' ? '.jpg,.jpeg,.png,image/jpeg,image/png' : d.destino === 'cierre' ? '.pdf,.jpg,.jpeg,.png' : '.pdf,application/pdf'; return selector.click();
    case 'nueva-enviar': {
      if (estado.guardando) return;
      const e = validarBorrador(b);
      if (Object.keys(e).length) { estado.erroresForm = e; estado._foco = 'resumen-err'; pintar(); const r = document.getElementById('resumen-err'); if (r) r.scrollIntoView({ block: 'center' }); return; }
      estado.erroresForm = null; return abrirModal('confirmar');
    }
    case 'nueva-descartar': return abrirModal('descartar');
    case 'nueva-otra': estado.exito = null; estado.borrador = null; return ir('nueva');
    case 'modal-abrir': return abrirModal(d.tipo);
    case 'modal-cerrar': estado.modal = null; return pintar();
    case 'modal-enviar': return enviarModal();
  }
}
document.addEventListener('click', e => {
  ultimaActividad = Date.now();
  const el = e.target.closest('[data-accion]');
  if (estado.menuUsuario && !e.target.closest('.usuario')) { estado.menuUsuario = false; if (!el) return pintar(); }
  if (!el) { if (e.target.classList && e.target.classList.contains('modal-fondo')) { estado.modal = null; pintar(); } return; }
  if (el.disabled) return;
  despachar(el.dataset.accion, el.dataset);
});
document.addEventListener('submit', e => { e.preventDefault(); if (e.target.dataset.envio) despachar(e.target.dataset.envio, e.target.dataset); });
document.addEventListener('input', e => {
  const t = e.target, c = t.dataset && t.dataset.campo; if (!c || t.tagName === 'SELECT') return;
  if (estado.usuario && estado.expirada) return salir('expirada');
  asignar(c, t.value);
  if (c.startsWith('borrador.')) {
    limpiarError(t.id);
    clearTimeout(relojBorrador); relojBorrador = setTimeout(marcarBorrador, 500);
    const m = c.match(/^borrador\.registros\.(\d+)\.descripcion$/); if (m) { const n = document.getElementById(`r${m[1]}-cuenta`); if (n) n.textContent = t.value.trim().length; }
  }
});
document.addEventListener('change', e => {
  const t = e.target, c = t.dataset && t.dataset.campo; if (!c || t.tagName !== 'SELECT') return;
  if (estado.usuario && estado.expirada) return salir('expirada');
  asignar(c, t.value);
  const m = c.match(/^borrador\.registros\.(\d+)\.(\w+)$/);
  if (m) { const r = estado.borrador.registros[Number(m[1])]; if (m[2] === 'sector') { r.carrera = ''; r.objeto = ''; } if (m[2] === 'carrera') r.objeto = ''; if (m[2] === 'nivel') { r.objeto = ''; r.recurso = ''; } }
  if (c === 'filtros.sector') estado.filtros.carrera = '';
  if (c === 'panel.sector') estado.panel.carrera = '';
  if (c === 'panel.carrera' && t.value) estado.panel.sector = carrera(t.value).sector;
  if (c.startsWith('panel.')) guardarPanel();
  if (c.startsWith('filtros.')) estado.pagina = 1;
  if (c.startsWith('borrador.')) { limpiarError(t.id); marcarBorrador(); }
  if (t.dataset.repintar != null) pintar();
});
document.addEventListener('keydown', e => {
  ultimaActividad = Date.now();
  if (e.key === 'Escape') { if (estado.modal) { estado.modal = null; return pintar(); } if (estado.menuUsuario) { estado.menuUsuario = false; return pintar(); } }
  // Atajos de demostración, sin presencia en la interfaz.
  if (e.altKey && e.shiftKey && e.code === 'KeyX' && estado.usuario) { e.preventDefault(); return salir('expirada'); }
  if (e.altKey && e.shiftKey && e.code === 'KeyD') { e.preventDefault(); return restaurarDatos(); }
  if (e.target.id === 'login-clave' && e.getModifierState) { const m = document.getElementById('mayusculas'); if (m) m.hidden = !e.getModifierState('CapsLock'); }
});

/* Arrastrar y soltar archivos */
document.addEventListener('dragover', e => { const z = e.target.closest && e.target.closest('[data-soltar]'); if (z) { e.preventDefault(); z.classList.add('sobre'); } });
document.addEventListener('dragleave', e => { const z = e.target.closest && e.target.closest('[data-soltar]'); if (z && !z.contains(e.relatedTarget)) z.classList.remove('sobre'); });
document.addEventListener('drop', e => { const z = e.target.closest && e.target.closest('[data-soltar]'); if (!z) return; e.preventDefault(); const a = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if (a) recibirArchivo(a.name, a.size, z.dataset.soltar); });

/* Información al pasar por los gráficos */
function mostrarTip(el) {
  tipEl.textContent = el.dataset.tip; tipEl.hidden = false;
  const r = el.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  tipEl.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + 'px';
  tipEl.style.top = (r.top - h - 8 < 8 ? r.bottom + 8 : r.top - h - 8) + 'px';
}
document.addEventListener('mouseover', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) mostrarTip(el); else tipEl.hidden = true; });
document.addEventListener('focusin', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) mostrarTip(el); else tipEl.hidden = true; });
window.addEventListener('scroll', () => { tipEl.hidden = true; }, { passive: true });

/* Cuenta regresiva del bloqueo y cierre por inactividad */
setInterval(() => {
  if (estado.usuario) { if (Date.now() - ultimaActividad > INACTIVIDAD) salir('expirada'); return; }
  const a = estado.login.aviso; if (!a || a.tipo !== 'bloqueo') return;
  if (!bloqueado(a.correo)) { delete estado.bloqueos[a.correo]; estado.login.aviso = null; return pintar(); }
  const el = document.getElementById('cuenta-atras'); if (el) el.textContent = faltan(a.correo);
}, 1000);

if (!anios().includes(estado.anioPanel)) estado.anioPanel = anios()[0];
pintar();
})();
</script>
