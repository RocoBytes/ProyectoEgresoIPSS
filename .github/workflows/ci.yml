name: CI

# Nunca `pull_request_target`: ese disparador ejecuta código de una rama ajena con los secretos del repositorio.
on: [push, pull_request]

# Mínimo privilegio: el flujo solo lee el código. Ningún paso publica ni escribe.
permissions:
  contents: read

# Una ejecución nueva sobre la misma rama cancela la anterior, que ya quedó obsoleta.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Bloquea ante cualquier vulnerabilidad conocida en dependencias de producción.
      - run: npm audit --omit=dev
      # Comprueba que cada paquete instalado tenga la firma de su registro.
      - run: npm audit signatures
      - run: npm run lint
      - run: npm run typecheck
      # Incluye las 26 reglas de base, que levantan PostgreSQL con Docker Compose (`bd-pruebas`):
      # así corren en cada push.
      - run: npm test

  e2e:
    needs: verificar
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Solo Chromium, más las bibliotecas del sistema que necesita en un runner limpio.
      - run: npx playwright install --with-deps chromium
      # Levanta la pila completa con Docker Compose (proyecto `ipss-e2e`), siembra, corre los tres flujos y la baja con sus volúmenes.
      - run: npm run e2e
      - name: Subir el informe de Playwright
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: informe-playwright
          path: |
            e2e/informe/
            e2e/resultados/
          retention-days: 7
          if-no-files-found: ignore

  imagenes:
    needs: verificar
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Solo construye: la publicación hacia GHCR queda fuera del esqueleto.
      - run: docker build -f apps/api/Dockerfile -t ipss-api:ci .
      - run: docker build -f apps/web/Dockerfile -t ipss-web:ci .
      - name: Validar el Caddyfile del proxy
        run: docker run --rm -e DOMINIO=localhost -v "$PWD/infra/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.9-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Validar el Caddyfile de la web
        run: docker run --rm -v "$PWD/apps/web/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.9-alpine caddy validate --config /etc/caddy/Caddyfile

  # Solo con una etiqueta de versión (v1.0.0, etc.) y solo si todo lo demás pasó. Publica las dos imágenes con los
  # nombres que espera infra/compose.yaml: ghcr.io/<GHCR_ORG>/ipss-api:<VERSION> y ghcr.io/<GHCR_ORG>/ipss-web:<VERSION>.
  publicar:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verificar, imagenes, e2e]
    runs-on: ubuntu-24.04
    # Único job con permiso de escritura: solo publica paquetes de este repositorio.
    permissions:
      contents: read
      packages: write
    env:
      # La etiqueta pasa por una variable de entorno y nunca se interpola dentro de un script.
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # GHCR exige el nombre en minúsculas y el dueño del repositorio puede traer mayúsculas.
      - name: Fijar la organización en minúsculas
        id: org
        run: echo "ghcr_org=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Procedencia (provenance) y SBOM se adjuntan a la imagen como atestaciones de BuildKit.
      - name: Publicar ipss-api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.org.outputs.ghcr_org }}/ipss-api:${{ env.VERSION }}
          provenance: mode=max
          sbom: true
      - name: Publicar ipss-web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.org.outputs.ghcr_org }}/ipss-web:${{ env.VERSION }}
          provenance: mode=max
          sbom: true
