# Actualizaciones automáticas con espera de 7 días, la misma regla de `min-release-age` en .npmrc.
# Las versiones mayores quedan fuera: CLAUDE.md prohíbe subirlas sin una decisión explícita.
# Los avisos de seguridad no esperan: Dependabot no aplica `cooldown` a las actualizaciones de seguridad.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      parches-y-menores:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # Las imágenes base están fijadas por etiqueta exacta; Dependabot propone la actualización a una revisión humana.
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /infra
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
